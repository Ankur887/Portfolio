<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#05060a"/>
  <!-- Neural net background lines -->
  <g opacity="0.15" stroke="#22d3ee" stroke-width="1">
    <line x1="100" y1="200" x2="400" y2="315"/>
    <line x1="400" y1="315" x2="700" y2="180"/>
    <line x1="700" y1="180" x2="1000" y2="315"/>
    <line x1="400" y1="315" x2="700" y2="450"/>
    <line x1="700" y1="450" x2="1000" y2="315"/>
    <line x1="100" y1="430" x2="400" y2="315"/>
    <line x1="700" y1="180" x2="700" y2="450"/>
  </g>
  <!-- Nodes -->
  <g opacity="0.4">
    <circle cx="100" cy="200" r="6" fill="#8b5cf6"/>
    <circle cx="100" cy="430" r="6" fill="#8b5cf6"/>
    <circle cx="400" cy="315" r="10" fill="#22d3ee"/>
    <circle cx="700" cy="180" r="8" fill="#22d3ee"/>
    <circle cx="700" cy="450" r="8" fill="#22d3ee"/>
    <circle cx="1000" cy="315" r="10" fill="#8b5cf6"/>
    <circle cx="1100" cy="150" r="5" fill="#fbbf24"/>
    <circle cx="1100" cy="480" r="5" fill="#fbbf24"/>
  </g>
  <!-- Main text -->
  <text x="600" y="270" font-family="sans-serif" font-size="96" font-weight="700" fill="#e6e8ef" text-anchor="middle">ANKUR</text>
  <text x="600" y="340" font-family="sans-serif" font-size="28" fill="#22d3ee" text-anchor="middle" letter-spacing="6">FULL STACK DEVELOPER  •  AI ENGINEER</text>
  <!-- Cyan accent line -->
  <rect x="480" y="360" width="240" height="2" fill="#22d3ee" opacity="0.6"/>
  <text x="600" y="410" font-family="sans-serif" font-size="18" fill="#9aa3b2" text-anchor="middle">React · FastAPI · LLMs · PostgreSQL</text>
</svg>
